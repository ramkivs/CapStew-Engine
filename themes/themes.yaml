# CR-023 / EMM-H2 — MANUAL THEME-TAG MAPPING DOCUMENT (authority-controlled)
#
# HOLDINGS-FREE v1: the signed-off factor-theme taxonomy (6 themes) with ZERO
# assignments. Every holding therefore groups by the sub_sector fallback
# (H2-D3-A) until the authority performs the manual tag pass and issues a new
# document version.
#
# Governance:
#   - Authority-controlled (H2-D5-A): edits only via the authority tag pass,
#     each producing a NEW document_version with a NEW effective_from.
#   - NOT policy.yaml (policy-semantics fence untouched).
#   - Theme IDs are immutable; renaming a name requires a rename_history
#     entry + new document_version (H2-D9-A); historical runs keep their
#     original meaning (payloads and CR-022 archives are immutable).
#   - Provenance-bearing (H2-D7): every assignment must carry the required
#     provenance fields; this header records document provenance.
#
# Document provenance:
#   owner:           Ramki (authority)
#   source:          EMM-H2 authority dispositions H2-D1..D10 (2026-08-27) +
#                    CR-023 taxonomy sign-off (2026-08-28)
#   change identity: chg-cr023-taxonomy-v1
schema_version: 1
