<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- CapitalCompass favicon — mirrors the in-app logo mark (.logo .mark in theme.css):
       rounded square, green→blue gradient, dark "CC" monogram. -->
  <defs>
    <linearGradient id="cc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#cc)"/>
  <text x="16" y="21.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#04120c">CC</text>
</svg>
