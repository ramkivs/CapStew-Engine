# CapitalCompass — policy (v1 · D-01…D-15)
# This file is the OPERATIONAL serialization of the signed D-01…D-15 policy in
# Methodology Freeze §14 — it must not introduce or silently alter policy values.
#
# Keys are kept in D-01…D-15 order so this file stays auditable against the
# freeze. A key the engine does not yet read is tagged [NOT CONSUMED] below —
# editing such a key changes NOTHING. tests/test_policy_keys.py fails if the
# tags drift from what app/ actually reads, so this note cannot go stale.
#
#   effective_from            provenance/datestamp only, never read as a rule
#   quality_drop_pts          needs QoQ quality series — not in the inputs
#   pledge_qoq_pp             needs QoQ pledge series  — not in the inputs
#   rerating_strong_pct       no re-rating feature in the engine
#   rerating_critical_pct     no re-rating feature in the engine
#   participation_adv_pct     needs 20d ADV — not in the inputs (see D-12 note)
#   hurdle_nifty_pct          D-14 hurdles are documented, not applied
#   hurdle_liquid_pct         D-14 hurdles are documented, not applied

policy_version: 1
effective_from: 2026-08-22   # [NOT CONSUMED] datestamp only

# D-01 bucket definitions (market cap, ₹ Cr)
buckets:
  large_cap_min_mcap_cr: 20000
  mid_cap_min_mcap_cr: 5000
  small_cap_min_mcap_cr: 500

# D-02 target allocation bands (% of portfolio)
target_bands:
  large: [4.0, 8.0]
  mid: [2.0, 5.0]
  small_micro: [1.0, 3.0]

# D-03 absolute max single-stock cap (G2)
max_single_stock_pct: 10.0

# D-04 rebalance trigger (× target mid-point)
rebalance_trigger_multiple: 1.5

# D-05 quality floor / thesis break (G1)
quality_floor: 40
quality_drop_pts: 20          # [NOT CONSUMED] needs QoQ quality series

# D-06 promoter pledge spike (G1)
pledge_threshold_pct: 10.0
pledge_qoq_pp: 5.0            # [NOT CONSUMED] needs QoQ pledge series

# D-07 LTCG defer window (G3) + valuation-extreme suppress override
ltcg_defer_window_days: 30
valuation_extreme_suppress: 85

# D-08 composite band boundaries (0–100)
bands:
  hold_max: 30      # 0–30  HOLD
  watch_max: 55     # 31–55 WATCH
  trim_max: 75      # 56–75 TRIM
                     # 76–100 HARVEST

# D-09 category weights (sum = 100)
weights:
  position_sizing: 25
  valuation_stretch: 25
  quality_drift: 20
  tax_efficiency: 15
  opportunity_cost: 10
  technical_regime: 5

# D-10 re-rating share thresholds (%)
# [NOT CONSUMED] the engine implements no re-rating watchlist; retained only so
# this file stays a faithful serialization of the signed D-10 decision.
rerating_strong_pct: 65       # [NOT CONSUMED] no re-rating feature
rerating_critical_pct: 80     # [NOT CONSUMED] no re-rating feature

# D-11 min meaningful position (dust floor)
min_position_alloc_pct: 0.5
min_position_value: 5000

# D-12 participation cap (C3)
participation_adv_pct: 10       # [NOT CONSUMED] % of 20d ADV — ADV is not an input
participation_position_pct: 25  # % of position, when ADV unknown

# D-13 transaction cost assumptions (%)
txn_cost_liquid_pct: 0.35
txn_cost_microcap_pct: 1.0

# D-14 opportunity-cost hurdles (% p.a. pre-tax)
hurdle_nifty_pct: 11.0        # [NOT CONSUMED] documented hurdle, not applied
hurdle_liquid_pct: 6.4        # [NOT CONSUMED] documented hurdle, not applied

# D-15 review cadence (days)
review_cadence:
  hold_high_conf_days: 90
  hold_low_conf_days: 30
  action_verify_days: 7
  gate_fired_days: 1

# Phase-1 operational parameters
ltcg_period_days: 365
recon_tolerance_inr: 0.01
